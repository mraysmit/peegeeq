global
    maxconn 50
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    log global

frontend pg_frontend
    bind *:5400
    default_backend pg_backend

backend pg_backend
    option pgsql-check user haproxy_check
    server postgres pg_circuit_breaker:5432 check inter 250ms fall 1 rise 1
