global
    maxconn 50
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 2s
    timeout client 10s
    timeout server 10s
    option tcplog
    log global

frontend pg_frontend
    bind *:5400
    default_backend pg_backends

backend pg_backends
    balance first
    option pgsql-check user haproxy_check
    server pg_primary pg_primary:5432 check inter 250ms fall 1 rise 1
    server pg_secondary pg_secondary:5432 check inter 250ms fall 1 rise 1 backup
