[databases]
peegeeq_pgbouncer = host=postgres port=5432 dbname=peegeeq_pgbouncer

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 1
max_client_conn = 20
max_prepared_statements = 32
track_extra_parameters = search_path
server_reset_query = DISCARD ALL
server_reset_query_always = 1
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
