# PeeGeeQ Default Configuration
# Every advertised peegeeq.* key in this file has a production runtime owner.

# Database
peegeeq.database.host=localhost
peegeeq.database.port=5432
# Optional TCP proxy endpoint. Blank values independently inherit host/port above.
peegeeq.database.proxy.host=
peegeeq.database.proxy.port=
peegeeq.database.name=peegeeq
peegeeq.database.username=peegeeq
peegeeq.database.password=peegeeq
# Deliberate placeholder: every deployment must supply its own schema.
peegeeq.database.schema=myschema
peegeeq.database.ssl.enabled=false

# Reactive pool
peegeeq.database.pool.max-size=32
peegeeq.database.pool.max-wait-queue-size=128
peegeeq.database.pool.connection-timeout-ms=30000
peegeeq.database.pool.idle-timeout-ms=600000
peegeeq.database.pool.shared=true

# Explicitly owned by the performance/bitemporal runtime
peegeeq.database.pool.wait-queue-multiplier=10
peegeeq.database.pipelining.enabled=true
peegeeq.database.pipelining.limit=1024
peegeeq.database.event.loop.size=0
peegeeq.database.worker.pool.size=0
peegeeq.database.use.event.bus.distribution=false
peegeeq.verticle.instances=0

# Queue
peegeeq.queue.max-retries=3
peegeeq.queue.visibility-timeout=PT30S
peegeeq.queue.batch-size=10
peegeeq.queue.polling-interval=PT5S
peegeeq.consumer.threads=1
peegeeq.queue.recovery.enabled=true
peegeeq.queue.recovery.processing-timeout=PT5M
peegeeq.queue.recovery.check-interval=PT10M
peegeeq.queue.dead-consumer-detection.enabled=true
peegeeq.queue.dead-consumer-detection.interval=PT1M
peegeeq.queue.consumer-group-retry.enabled=true
peegeeq.queue.consumer-group-retry.interval=PT30S

# Metrics
peegeeq.metrics.enabled=true
peegeeq.metrics.depth-cache-interval=PT5S
peegeeq.metrics.instance-id=peegeeq-default

# Circuit breaker
peegeeq.circuit-breaker.enabled=true
peegeeq.circuit-breaker.minimum-number-of-calls=5
peegeeq.circuit-breaker.wait-duration-in-open-state=PT1M
peegeeq.circuit-breaker.sliding-window-size=100
peegeeq.circuit-breaker.failure-rate-threshold=50.0
peegeeq.circuit-breaker.slow-call-rate-threshold=100.0
peegeeq.circuit-breaker.slow-call-duration-threshold=PT60S
peegeeq.circuit-breaker.permitted-calls-in-half-open-state=3

# Health
peegeeq.health.enabled=true
peegeeq.health.queue-checks-enabled=true
peegeeq.health.check-interval=PT30S
peegeeq.health.timeout=PT5S

# PostgreSQL notices
peegeeq.notices.info.enabled=true
peegeeq.notices.info.level=INFO
peegeeq.notices.other.enabled=false
peegeeq.notices.other.level=DEBUG
peegeeq.notices.metrics.enabled=true
